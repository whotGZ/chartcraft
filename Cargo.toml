[package]
name = "chartcraft"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Clinician-first, FHIR-native, open-source EMR in Rust (Milestone 0 skeleton)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
