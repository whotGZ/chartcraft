[package]
name = "chartcraft"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Clinician-first, FHIR-native, open-source EMR in Rust (Milestone 4: local password auth + sessions + access control + real Provenance/AuditEvent signer, on top of FHIR CRUD/search, versioned hash-chained store, superbill, and static web serving)"

# The embeddable core as a library (so a downstream crate can depend on it), plus
# a thin binary that wires it up. Declared explicitly, though Cargo would also
# auto-detect both from src/lib.rs + src/main.rs.
[lib]
name = "chartcraft"
path = "src/lib.rs"

[[bin]]
name = "chartcraft"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
sha2 = "0.10"
argon2 = "0.6.0"
rand = "0.10.4"
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
